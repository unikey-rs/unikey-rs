[package]
name = "unikey-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A native Wayland Vietnamese keyboard and multi-layout text composer with GUI and CLI"
license = "MIT"
authors = ["UniKey RS contributors"]
repository = "https://github.com/unikey-rs/unikey-rs"
default-run = "unikey-rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "unikey-rs"
path = "src/main.rs"
